<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>逐鹿 水墨兵戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e6dfcc;--paper2:#f1ecdd;--ink:#1d1b19;--wash:#6f6b62;--zhu:#b3261e;--qing:#2f4d66;--zhe:#8f6a3f;
  --line:rgba(29,27,25,.3);--panel:rgba(238,232,216,.93);--on-zhu:#f6f0e2;
  --brush:"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif;
  --body:"Noto Serif SC","Songti SC","SimSun",serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1b1d20;--paper2:#25282c;--ink:#e3ddcc;--wash:#a39f93;--zhu:#d5493c;--qing:#86a9c2;--zhe:#c39d68;
  --line:rgba(227,221,204,.26);--panel:rgba(30,32,36,.93);--on-zhu:#fbf5e8;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1b1d20;--paper2:#25282c;--ink:#e3ddcc;--wash:#a39f93;--zhu:#d5493c;--qing:#86a9c2;--zhe:#c39d68;
  --line:rgba(227,221,204,.26);--panel:rgba(30,32,36,.93);--on-zhu:#fbf5e8;color-scheme:dark}
:root[lang="en"]{--brush:"Cormorant Garamond","Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.75;overflow:hidden;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:.3em .9em;cursor:pointer;font-family:var(--brush);font-size:18px;line-height:1.3}
button:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
button.pri{background:var(--zhu);color:var(--on-zhu);border-color:var(--zhu)}
button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
kbd{font-family:var(--body);font-size:11px;opacity:.55;margin-left:.35em}
@media (hover:none){kbd{display:none}}
.seal{display:inline-grid;place-items:center;width:2em;height:2em;background:var(--zhu);color:var(--on-zhu);font-family:var(--brush);font-size:34px;border-radius:5px;margin:0;transform:rotate(-4deg)}
.seal.lost{background:var(--wash)}
.seal.sm{font-size:15px;font-style:normal;margin-left:.5em;vertical-align:middle;border-radius:3px}

/* 卷首 */
#title{height:100%;overflow:auto;position:relative;display:grid;grid-template-columns:auto minmax(0,34rem);gap:clamp(1.5rem,6vw,6rem);align-items:center;justify-content:center;padding:clamp(1rem,4vw,3rem);padding-bottom:20vh}
#title .hd{display:flex;flex-direction:row-reverse;gap:.9rem;align-items:flex-start}
#title h1,#title .sub{writing-mode:vertical-rl;white-space:nowrap}
#title h1{font-family:var(--brush);font-weight:400;font-size:clamp(84px,17vw,190px);line-height:1;margin:0;letter-spacing:.06em}
#title .sub{font-size:15px;color:var(--wash);letter-spacing:.35em;margin:1.2em 0 0}
#title .sub b{color:var(--zhu);font-weight:400}
#mlist{list-style:none;margin:0;padding:0}
#mlist li{display:grid;grid-template-columns:3.2rem 1fr auto;gap:1rem;align-items:center;padding:1.05rem 0;border-top:1px solid var(--line)}
#mlist li:last-child{border-bottom:1px solid var(--line)}
#mlist .ord{font-family:var(--brush);font-size:22px;color:var(--wash)}
#mlist h3{font-family:var(--brush);font-weight:400;font-size:34px;line-height:1.1;margin:0}
#mlist p{margin:0}
#mlist h3 small{font-size:.62em;color:var(--wash);margin-left:.35em}
@media (min-width:721px){:root[lang="en"] #mlist li{grid-template-columns:4.6rem 1fr auto}}
:root[lang="en"] #mlist .ord{font-size:18px;line-height:1.15}
:root[lang="en"] #title .sub{letter-spacing:.14em}
:root[lang="en"] #diff label{grid-template-columns:minmax(5.5em,8.2em) 1fr 4.2em}
.role{color:var(--wash);font-size:13px;letter-spacing:.08em}
#diff{margin-top:1.3rem;display:grid;gap:.25rem}
#diff .dh{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.2rem}
#diff h2{font-family:var(--brush);font-weight:400;font-size:26px;line-height:1;margin:0}
#presets{display:flex;gap:.35rem}
#presets button{font-size:17px;padding:.1em .8em}
#diff label{display:grid;grid-template-columns:4.6em 1fr 3.6em;gap:.8rem;align-items:center;font-size:14px}
#diff output{color:var(--wash);font-size:13px;text-align:right;white-space:nowrap}
#diff input[type=range]{width:100%;accent-color:var(--zhu);margin:0;height:1.6rem}
#diff input[type=range]:focus-visible{outline:2px solid var(--zhu);outline-offset:2px}
#title .foot{margin-top:1.4rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;color:var(--wash);font-size:13px}
#title svg.mt{position:fixed;left:0;right:0;bottom:0;width:100%;height:32vh;pointer-events:none;color:var(--ink);z-index:-1}
#title{isolation:isolate}
@media (max-width:720px){
  #title{grid-template-columns:1fr;align-items:start;gap:1rem}
  #title .hd{flex-direction:column;gap:0}
  #title h1,#title .sub{writing-mode:horizontal-tb;white-space:normal}
  #title h1{font-size:84px}
  #title .sub{letter-spacing:.2em}
  #mlist li{grid-template-columns:1fr auto}
  #mlist .ord{display:none}
}

/* 战场 */
#game{position:relative;height:100%;overflow:hidden;background:#e6dfcc}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#top{position:absolute;top:0;left:0;right:0;display:flex;gap:.4rem 1.1rem;align-items:center;flex-wrap:wrap;padding:.3rem .8rem;background:var(--panel);border-bottom:1px solid var(--line)}
#top .t{font-family:var(--brush);font-size:22px;line-height:1.2;white-space:nowrap}
#top .t small{font-family:var(--body);font-size:12px;color:var(--wash);margin-left:.35em}
#force{font-size:13px;color:var(--wash);white-space:nowrap}
#top .sp{margin-left:auto;display:flex;gap:.35rem}
#top button{font-size:16px;padding:.15em .6em}
#obj{position:absolute;top:3.3rem;left:.6rem;max-width:min(21rem,70vw);background:var(--panel);border:1px solid var(--line);padding:.35rem .7rem .45rem;font-size:13px;line-height:1.6}
#obj button{all:unset;cursor:pointer;font-family:var(--brush);font-size:17px;display:block}
#obj button:focus-visible{outline:2px solid var(--zhu)}
#obj.shut ul{display:none}
#obj ul{list-style:none;margin:.15rem 0 0;padding:0}
#obj li{padding-left:1.2em;position:relative}
#obj li::before{content:"○";position:absolute;left:0;color:var(--wash)}
#obj li.ok::before{content:"●";color:var(--zhu)}
#obj li.bad{text-decoration:line-through;color:var(--wash)}
#obj li.bad::before{content:"×"}
#log{position:absolute;top:3.4rem;left:50%;transform:translateX(-50%);width:min(30rem,56vw);pointer-events:none;text-align:center}
#log .ln{display:inline-block;background:var(--panel);border-left:3px solid var(--wash);padding:.05rem .7rem;margin-bottom:.25rem;font-size:14px;animation:lnin .25s ease-out}
#log .ln.warn{border-left-color:var(--zhu)}
#log .ln.good{border-left-color:var(--qing)}
@keyframes lnin{from{opacity:0}to{opacity:1}}
#quote{position:absolute;right:1.1rem;top:4.2rem;height:min(46vh,400px);writing-mode:vertical-rl;pointer-events:none;opacity:0;transition:opacity .8s;color:#1d1b19;text-shadow:0 0 14px #e6dfcc,0 0 6px #e6dfcc,0 0 2px #e6dfcc}
#quote.on{opacity:1}
#qtext{font-family:var(--brush);font-size:clamp(24px,3.2vw,38px);line-height:1.3;letter-spacing:.1em}
#qsrc{display:inline-block;font-family:var(--brush);font-size:15px;line-height:1.5;background:#b3261e;color:#f6f0e2;padding:.5em .15em;text-shadow:none;border-radius:2px;margin-top:.8em}
#qen{writing-mode:horizontal-tb;position:absolute;top:100%;right:0;width:min(17rem,60vw);margin-top:.6rem;text-align:right;font-style:italic;font-size:14px;line-height:1.45}
#qen:empty{display:none}
#mini{position:absolute;right:.6rem;bottom:6.6rem;width:180px;height:114px;border:1px solid var(--ink);background:#e6dfcc;touch-action:none;cursor:pointer}
#cmd{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:.35rem .8rem .5rem}
#selinfo{font-size:13.5px;line-height:1.55;min-height:3.1em}
#selinfo b{font-family:var(--brush);font-weight:400;font-size:19px}
#selinfo i{font-style:normal;color:var(--zhu)}
#selinfo small{color:var(--wash)}
#siegemenu,#tacmenu{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;padding:.15rem 0;font-size:12.5px;color:var(--wash)}
#siegemenu button,#tacmenu button{font-size:17px;padding:.15em .8em;border-color:var(--zhe)}
#btns{display:flex;gap:.35rem;overflow-x:auto;padding:.2rem 0 .1rem;scrollbar-width:thin}
#btns button{white-space:nowrap;flex:none;padding:.3em .62em}
#btns .gap{flex:none;width:.6rem;border:0;padding:0;pointer-events:none}
@media (max-width:720px){
  #top .sp{margin-left:0;width:100%;justify-content:flex-end}
  #mini{width:120px;height:76px;bottom:7.6rem}
  #top .t{font-size:18px}
  #force{display:none}
  #obj{top:5.4rem;font-size:12px}
  #log{top:5.4rem;left:auto;right:.4rem;transform:none;width:50vw;text-align:right}
  #quote{top:8.6rem;height:38vh}
}

/* 编辑器 */
#mlist .acts{display:flex;flex-direction:column;gap:.35rem}
#mlist .acts button{font-size:16px;padding:.2em .8em}
#editor{height:100%;display:flex;flex-direction:column;background:var(--paper)}
#etop{display:flex;gap:.4rem .5rem;align-items:center;flex-wrap:wrap;padding:.35rem .8rem;border-bottom:1px solid var(--line)}
#etop .t{font-family:var(--brush);font-size:24px;margin-right:.4rem}
#etop .sp{margin-left:auto}
#etop button,#editor select,#editor input,#editor textarea{font-size:14px}
#etop button{font-size:16px;padding:.15em .7em}
#editor select,#editor input,#editor textarea{font-family:var(--body);color:var(--ink);background:var(--paper2);border:1px solid var(--line);border-radius:2px;padding:.2em .35em;min-width:0}
#editor textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.45;resize:vertical}
#editor textarea.bad{border-color:var(--zhu);outline:1px solid var(--zhu)}
#emsg{margin:0;padding:.2rem .8rem;min-height:1.9em;font-size:13px;color:var(--zhu);border-bottom:1px solid var(--line)}
#ebody{flex:1;min-height:0;display:grid;grid-template-columns:9.5rem minmax(0,1fr) 22rem}
#etools{overflow:auto;padding:.2rem .6rem .8rem;border-right:1px solid var(--line)}
#editor h4{font-family:var(--brush);font-weight:400;font-size:19px;margin:.7em 0 .2em}
#etools .tg{display:grid;grid-template-columns:1fr 1fr;gap:.25rem}
#etools .tg button,#epane button,#etabs button{font-size:15px;padding:.15em .3em;line-height:1.4}
#etools .tg i{display:inline-block;width:.7em;height:.7em;margin-right:.3em;border:1px solid var(--line);vertical-align:-.05em}
#editor .fr{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:.4rem;align-items:center;margin:.25rem 0;font-size:13px}
#etools .fr{grid-template-columns:2.6em minmax(0,1fr)}
#editor .fr>input+input{grid-column:2}
#editor .fr input[type=checkbox]{justify-self:start;width:1.1em;height:1.1em;accent-color:var(--zhu)}
#ewrap{overflow:auto;background:#cfc8b6;padding:.5rem}
#ecv{display:block;touch-action:none;cursor:crosshair;box-shadow:0 0 0 1px var(--ink)}
#eside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}
#etabs{display:flex;flex-wrap:wrap;gap:.2rem;padding:.35rem .5rem;border-bottom:1px solid var(--line)}
#epane{flex:1;overflow:auto;padding:.3rem .7rem 1rem;font-size:13px}
#epane .hint{color:var(--wash);font-size:12.5px;line-height:1.6;margin:.4em 0}
#epane .jf{margin:.6rem 0}
#epane .jf b{font-family:var(--brush);font-weight:400;font-size:17px;margin-right:.5em}
#epane .tp{display:inline-flex;flex-wrap:wrap;gap:.2rem;margin:.15rem 0 .25rem}
#epane .tp button{font-size:13px;font-family:var(--body);padding:.05em .45em}
#epane .doc{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.55;margin:0}
@media (max-width:900px){
  #editor{overflow:auto;display:block;height:100%}
  #ebody{display:block}
  #etools,#eside{border:0;border-bottom:1px solid var(--line)}
  #etools .tg{grid-template-columns:repeat(4,1fr)}
  #ewrap{max-height:60vh}
}

/* 卷轴弹层 */
#modal{position:fixed;inset:0;z-index:20;background:rgba(20,20,22,.42);display:grid;place-items:center;padding:1rem;overflow:auto}
#mcard{background:var(--paper);color:var(--ink);border:1px solid var(--ink);box-shadow:0 0 0 5px var(--paper),0 0 0 6px var(--line);max-width:38rem;width:100%;max-height:calc(100% - 1rem);overflow:auto;padding:1.4rem clamp(1rem,4vw,2.2rem) 1.2rem}
#mcard h2{font-family:var(--brush);font-weight:400;font-size:46px;line-height:1.1;margin:.1em 0 .1em}
#mcard h3{font-family:var(--brush);font-weight:400;font-size:22px;margin:1em 0 .2em;border-bottom:1px solid var(--line)}
#mcard .ord{font-family:var(--brush);color:var(--wash);font-size:20px;margin:0}
#mcard p{margin:.5em 0}
#mcard ul{margin:.3em 0;padding-left:1.3em}
#mcard table{border-collapse:collapse;width:100%;font-size:14px}
#mcard th,#mcard td{text-align:left;padding:.25em .5em .25em 0;border-bottom:1px solid var(--line);vertical-align:top}
#mcard th{font-family:var(--brush);font-weight:400;font-size:18px;white-space:nowrap}
#mcard .pv{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.4em 0}
#mcard .pv button{font-size:17px}
#mcard select,#mcard input{font:inherit;font-size:15px;color:var(--ink);background:var(--paper2);border:1px solid var(--line);border-radius:2px;padding:.3em .5em;min-width:0}
#mcard input{width:7em;text-transform:uppercase;letter-spacing:.2em}
#pv_status{color:var(--zhu);min-height:1.7em;margin:.3em 0}
#mcard textarea{display:block;width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.4;color:var(--ink);background:var(--paper2);border:1px solid var(--line);border-radius:2px;padding:.35em .5em;resize:vertical;word-break:break-all}
#mcard textarea:focus-visible,#mcard input:focus-visible,#mcard select:focus-visible{outline:2px solid var(--zhu);outline-offset:1px}
#mcard .st{margin:.6em 0 .25em;font-size:14px}
#mcard button.lk{border:0;padding:0;font-family:var(--body);font-size:inherit;color:var(--zhu);text-decoration:underline;text-underline-offset:3px;background:none}
#mcard button:disabled{opacity:.5;cursor:default}
#mbtns{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
@media (prefers-reduced-motion:reduce){#quote{transition:none}#log .ln{animation:none}}
</style>
</head>
<body>
<section id="title">
  <div class="hd">
    <h1>逐鹿</h1>
    <p class="sub" data-en="Chasing the Deer　&lt;b&gt;An ink-wash war game&lt;/b&gt;">秦失其鹿　天下共逐之　<b>水墨兵戏</b></p>
  </div>
  <div>
    <ol id="mlist"></ol>
    <section id="diff" aria-label="难度与音量" data-en-label="Difficulty and volume">
      <div class="dh"><h2 data-en="Difficulty">难度</h2><div id="presets"><button data-p="0" data-en="Recruit">初阵</button><button data-p="1" data-en="Veteran">宿将</button><button data-p="2" data-en="Master">名帅</button></div></div>
      <label><span data-en="Enemy strength">敌军兵力</span><input type="range" id="d_force" min="50" max="170" step="5"><output id="o_force"></output></label>
      <label><span data-en="Enemy might">敌军战力</span><input type="range" id="d_might" min="70" max="140" step="5"><output id="o_might"></output></label>
      <label><span data-en="Enemy cunning">敌将谋略</span><input type="range" id="d_wit" min="1" max="3" step="1"><output id="o_wit"></output></label>
      <label><span data-en="Supply time">粮草时限</span><input type="range" id="d_pace" min="70" max="130" step="5"><output id="o_pace"></output></label>
      <label><span data-en="Volume">音量</span><input type="range" id="d_vol" min="0" max="100" step="5"><output id="o_vol"></output></label>
    </section>
    <div class="foot"><button id="bcodex" data-en="Art of War Primer">兵法要览</button><button id="bpvp" data-en="Online Battle">联机对战</button><button id="bedit" data-en="Campaign Editor">战役编辑器</button><button id="blang" lang="en">English</button><span>知彼知己，百战不殆。</span></div>
  </div>
  <svg class="mt" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">
    <path fill="currentColor" opacity=".08" d="M0,200 C80,130 140,170 200,100 C240,60 280,130 340,95 C400,55 460,140 520,115 C600,75 680,160 760,125 C840,95 900,160 1000,135 L1000,300 L0,300Z"/>
    <path fill="currentColor" opacity=".13" d="M0,250 C60,205 120,230 180,175 C230,135 260,200 320,188 C380,160 420,105 470,170 C540,222 600,190 660,148 C720,118 780,212 860,200 C920,190 960,222 1000,210 L1000,300 L0,300Z"/>
    <path fill="currentColor" opacity=".24" d="M0,285 C100,252 160,275 240,244 C320,218 380,266 460,256 C560,244 640,276 720,250 C800,230 900,276 1000,258 L1000,300 L0,300Z"/>
  </svg>
</section>

<section id="game" hidden>
  <canvas id="cv"></canvas>
  <header id="top">
    <span class="t" id="clock"></span>
    <span class="t" id="wx"></span>
    <span id="force"></span>
    <span class="sp">
      <button id="bsnd">有声</button><button id="bpause">暂停</button><button id="bspeed">快进</button><button id="bhelp" data-en="Primer">兵法</button><button id="bquit" data-en="Withdraw">收兵</button>
    </span>
  </header>
  <aside id="obj"><button id="bobj" aria-label="展开或收起军令" data-en-label="Show or hide orders" data-en="Orders">军令</button><ul id="objlist"></ul></aside>
  <div id="log" aria-live="polite"></div>
  <div id="quote" aria-live="polite"><span id="qtext"></span><span id="qsrc"></span><span id="qen"></span></div>
  <canvas id="mini" width="180" height="114" aria-label="小地图" data-en-label="Minimap"></canvas>
  <footer id="cmd">
    <div id="selinfo"></div>
    <div id="tacmenu" class="submenu" hidden>
      <button data-c="wings" data-en="Double Envelopment">两翼包抄</button><button data-c="rear" data-en="Rear Assault">绕后夹击</button><button data-c="side" data-en="Flanking Attack">侧翼包抄</button>
      <span data-en="Pick one, then click an enemy. A single unit splits itself; with several, the nearest becomes the front.">选一种，再点选敌军。单阵自动分兵；多阵则最近者为前军。</span>
    </div>
    <div id="siegemenu" hidden>
      <button data-c="ram" data-en="Ram">冲车</button><button data-c="ladder" data-en="Ladders">云梯</button><button data-c="cata" data-en="Trebuchet">发石车</button><button data-c="nogear" data-en="Drop Engine">弃器</button>
      <span data-en="Rams break gates, ladders scale walls, trebuchets batter walls and towers from afar. Units must stand still to build.">冲车撞门，云梯翻墙，发石车远轰城垣、箭楼。造器须原地停驻。</span>
    </div>
    <div id="btns">
      <button data-c="hold" data-en="Hold&lt;kbd&gt;G&lt;/kbd&gt;">镇守<kbd>G</kbd></button>
      <button data-c="stop" data-en="Stop&lt;kbd&gt;X&lt;/kbd&gt;">止步<kbd>X</kbd></button>

  <h2>兵法要览</h2>
  <h3>号令</h3>
  <table>
    <tr><th>鼠标</th><td>左键点选，拖框多选，双击选同种；右键行军，右键敌阵进攻；滚轮缩放，方向键或 WASD 移动视野。</td></tr>
    <tr><th>触屏</th><td>轻点军阵选中，轻点地面行军，轻点敌阵进攻；单指拖动视野，双指缩放。</td></tr>
    <tr><th>联机对战</th><td>卷首点“联机对战”。一人选战图“开局”，另一人“应战”。在 claude.ai 上用四位战局号；在其他地方（如自己架的网页）则两人互换一次“邀请码”和“回执码”，两台电脑跨网络直接相连。开局者执朱旗，应战者执青旗，各自只看得见自己视野内的敌军；斩敌主将或夺其帅旗者胜。对战中不能暂停、快进。</td></tr>

    <tr><th>镇守</th><td>原地坚守不追击，所受伤害减少；稍久即成“深沟高垒”，不惧冲锋。在林中镇守则为伏兵，敌不能察，暴起一击威力倍增。</td></tr>
    <tr><th>分兵 合兵</th><td>一阵分为两阵，可分守要道、包抄侧背；相邻的同种军阵可再合为一。</td></tr>

    <tr><th>战术</th><td>选中军阵，点“战术”选一种，再点选敌军。<b>两翼包抄</b>：一阵分为左右两翼，各绕到敌军侧面再合击。<b>绕后夹击</b>：前军逼近敌前镇守当面，后军兜一个大圈绕到敌后，前后夹击。<b>侧翼包抄</b>：前军镇守，后军迂回到敌军一侧攻其肋。只选一阵时自动对半分兵（须满一千六百人，主将亲卫不可分）；选中多阵时不分兵，离敌最近的一阵为前军，其余迂回。迂回途中旗旁标“抄”，到位后自行进攻；再下别的命令即取消。</td></tr>

  <h3>敌将用兵</h3>

    <tr><th>常法</th><td>在守拙之上：骑兵专寻弩手；临敌变阵，弩手雁行、骑兵锋矢，追击溃兵与弩手用锋矢。</td></tr>

    <tr><th>方阵</th><td>攻守均衡，稳阵可挫锋矢之锐。</td></tr>

    <tr><th>圆阵</th><td>守坚而行缓，不惧侧背受敌；阵密，易为弩矢所伤。</td></tr>
    <tr><th>雁行阵</th><td>两翼展开，弩手射远而伤重；近战薄弱，畏锋矢突击。</td></tr>
  </table>
  <h3>地利 天时</h3>
  <table>

    <tr><th>浅滩</th><td>涉水之军伤亡倍增，是为半渡而击。</td></tr>
    <tr><th>侧背</th><td>敌与他阵交锋时击其侧后，伤亡与士气打击俱增。三阵围攻一阵亦然。</td></tr>

  </table>

<template id="codex-en">
  <h2>Art of War Primer <small lang="zh">兵法要览</small></h2>
  <h3>Orders</h3>
  <table>
    <tr><th>Mouse</th><td>Left-click to select, drag a box for several, double-click to select every unit of that kind. Right-click ground to march, right-click an enemy to attack. Wheel to zoom; arrow keys or WASD to pan.</td></tr>
    <tr><th>Touch</th><td>Tap a unit to select, tap ground to march, tap an enemy to attack. Drag with one finger to pan, pinch to zoom.</td></tr>
    <tr><th>Online Battle</th><td>On the title screen press “Online Battle”. One player picks a map and opens a game; the other answers it. On claude.ai you use a four-character game code; elsewhere (on your own hosted page) the two players swap an “invite code” and a “reply code” once, and the two computers connect directly across the internet. The host leads the vermilion banner, the guest the azure; each sees only enemies within their own sight. Kill the enemy general or take their banner to win. Online games cannot be paused or sped up.</td></tr>
    <tr><th>The field</th><td>A raised, oblique view: hills, cliffs, walls and towers have height, and units stand on top of them; tall things hide what lies behind. Selected soldiers raise their weapons and answer “诺”; given an order they reply “得令” (“As you command”).</td></tr>
    <tr><th>Hold</th><td>Stand fast and do not pursue; take less damage. After a while the unit is entrenched and shrugs off charges. Holding in a forest makes an ambush: the enemy cannot see you, and the first strike hits twice as hard.</td></tr>
    <tr><th>Split / Merge</th><td>Divide one unit into two to guard several roads or strike flanks; neighbouring units of the same kind can merge back into one.</td></tr>
    <tr><th>Force March</th><td>Faster movement that drains stamina quickly. Tired troops fight far worse; use sparingly.</td></tr>
    <tr><th>Tactics</th><td>Select units, press Tactics, pick one, then click an enemy. <b>Double Envelopment</b>: split into left and right wings that swing onto the enemy’s sides. <b>Rear Assault</b>: the front unit pins the enemy face-on while the rest loop wide behind it. <b>Flanking Attack</b>: the front unit holds while the rest wheel onto one flank. With one unit selected it splits in half automatically (needs 1,600 men; a general’s guard cannot split). With several selected, the nearest becomes the front and the others manoeuvre. Manoeuvring units show “抄” by their banner and attack once in place; any new order cancels it.</td></tr>
    <tr><th>Tower</th><td>Infantry or crossbowmen build an arrow tower on the spot: about 14 s per storey, up to three, halted by combat. Standing on it raises their height — a great boon to crossbowmen.</td></tr>
    <tr><th>Siege</th><td>Infantry build engines where they stand and then march more slowly. <b>Ram</b>: breaks gates five times faster. <b>Ladders</b>: climb straight over walls, though troops on the wall top suffer more. <b>Trebuchet</b> (crossbowmen can work it too): right-click or tap an enemy wall, gate or tower to bombard it from 300 paces; a collapsed wall leaves a breach.</td></tr>
    <tr><th>Fire</th><td>Crossbowmen loose fire arrows to burn forests and enemy camps. Fire spreads with the wind and will not catch in rain.</td></tr>
  </table>
  <h3>Enemy Generals</h3>
  <table>
    <tr><th>Plodding</th><td>By the book: attacks in the scripted waves, holds its strongpoints, fights only what is near, never changes formation.</td></tr>
    <tr><th>Orthodox</th><td>As Plodding, plus: cavalry hunt crossbowmen; formations change on contact — crossbowmen in Wild Goose, cavalry in Arrowhead, Arrowhead to chase routers and archers.</td></tr>
    <tr><th>Cunning</th><td>As Orthodox, plus: picks fights it counters, gangs up on units already engaged and shaken; cavalry strike flanks and rear; crossbowmen fall back from melee to shoot again; surrounded units form a Circle; wavering units withdraw to regroup; on clear days it burns forests and camps with fire arrows.</td></tr>
  </table>
  <h3>Unit Counters</h3>
  <table>
    <tr><th>Halberdiers <span lang="zh">戟</span></th><td>Long polearms stop horses: they beat cavalry, but struggle when shieldmen close in.</td></tr>
    <tr><th>Shieldmen <span lang="zh">盾</span></th><td>Great shields turn arrows; in melee they beat halberdiers and crossbowmen, but fear cavalry charges.</td></tr>
    <tr><th>Crossbowmen <span lang="zh">弩</span></th><td>Deadly at range, farther from high ground; weak in melee and terrified of cavalry. Rain, fog and night all blunt them.</td></tr>
    <tr><th>Cavalry <span lang="zh">骑</span></th><td>Swift as wind, charges shatter ranks; beats crossbowmen and supply trains. Charging halberds head-on is fatal; forest and marsh slow them; no charges in rain.</td></tr>
  </table>
  <h3>Formation Counters</h3>
  <table>
    <tr><th>Square <span lang="zh">方阵</span></th><td>Balanced attack and defence; its steadiness blunts the Arrowhead.</td></tr>
    <tr><th>Arrowhead <span lang="zh">锋矢阵</span></th><td>Strong, fast attack with weak defence; breaks the Wild Goose, but cannot shake a Circle.</td></tr>
    <tr><th>Circle <span lang="zh">圆阵</span></th><td>Solid defence but slow; immune to flank and rear attacks. Packed tight, it suffers from arrows.</td></tr>
    <tr><th>Wild Goose <span lang="zh">雁行阵</span></th><td>Wings spread wide: crossbowmen shoot farther and harder. Thin in melee; fears the Arrowhead.</td></tr>
  </table>
  <h3>Terrain and Season</h3>
  <table>
    <tr><th>Height</th><td>Plains are 0; hills rise from 1 at the foot to 3 at the top; your own wall top is 2; each tower storey adds 1. Every level up gives +12% melee damage, −10% damage taken, +10% bow range and damage, and wider sight; attacking uphill is the reverse. Charging downhill adds momentum; cavalry charging uphill gain nothing. Climbing is slow.</td></tr>
    <tr><th>Passes</th><td>Cliffs cannot be crossed. A gap one or two tiles wide between cliffs, walls or water is a pass (so are gates, breaches and narrow fords): only 2,000–3,400 men per unit can fight there, big armies move through slowly, and troops inside take heavier arrow fire, especially from above. One unit holding a pass can defeat many.</td></tr>
    <tr><th>Ambush</th><td>Hold for a moment in forest or on high ground (height 2+) to become hidden; the enemy only notices you up close, and your first strike hits twice as hard.</td></tr>
    <tr><th>Hard going</th><td>Cavalry crossing forest, marsh or steep slopes (height 2+) lose horses along the way — more than double when force-marching, and galloping in rain also hurts. Roads and plains are safe.</td></tr>
    <tr><th>Fords</th><td>Troops wading take double casualties: strike them halfway across.</td></tr>
    <tr><th>Flank &amp; rear</th><td>Hit an enemy in the side or back while it is engaged elsewhere for heavier casualties and morale damage. Three units on one does the same.</td></tr>
    <tr><th>Encirclement</th><td>Surrounded on all sides with no way out, an enemy fights to the death; leave one side open and it breaks more easily.</td></tr>
    <tr><th>Morale &amp; stamina</th><td>Morale recovers near your general; losses and hunger drain it, and too low means rout. The rested beat the weary.</td></tr>
    <tr><th>Day, night, weather</th><td>Night and heavy fog shrink sight, hiding distant enemies. Arrows fly farther downwind, shorter into the wind.</td></tr>
  </table>

rout the Qin army","Before your grain runs out","Xiang Yu must survive"],"tips":["You carry only three days of grain and will get no more: when it runs out morale falls daily. Fight fast.","Death-Sworn (死士, Chu's elite halberdiers) counter Qin chariots — put them in front.","Detach troops to take the corridor in the west first: once Qin is cut off its morale sinks; then converge on Wang Li's main body.","Qin guards the north-bank crossing, so it is you who will be hit halfway across. Pin them with crossbowmen from across the river, or go around by the eastern ford."],"winText":"Every Chu warrior fought as ten, and their war cries shook the heavens. In nine battles they cut the corridor, crushed the Qin and captured Wang Li. When the allied generals came through the camp gate, every one of them advanced on his knees, and none dared look up."}},{"id":"jiangwu","first":true,"name":"讲武","ord":"教习","role":"赵 新拜裨将","line":"校场讲武：行军、统众、变阵、接战、火攻、合击，一一习之。","brief":"秦兵压上党，赵国征发新军。新拜裨将者，先赴邯郸城外校场，习旌旗金鼓之令、四阵进退之法，然后从军长平。校尉在侧，每成一课，即授下一课。","goals":["依校尉教示，逐课习之","击破校场东面的秦军"],"tips":["电脑：左键点选、拖框多选，右键行军或进攻；方向键或 WASD 移动视野，滚轮缩放，中键拖动画面，点小地图可跳转。","手机：轻点军阵选中，轻点地面行军，轻点敌阵进攻；单指拖动画面，双指缩放。","兵种相克：戟克骑，骑克弩，盾克戟与弩。骑兵行军最快，但撞上戟兵吃亏。","其余号令：镇守 G（就地固守，久守成深沟高垒）、止步 X、急行 R（快但耗体力）、分兵 F、合兵 C、筑楼 B、攻城器 E。空格暂停，可随时暂停再下令。","左上角军令一课一勾。忘了要领，可点“收兵”→“军令与献策”重看这些献策。"],"winText":"三军既习，进退有度。《司马法》曰：“天下虽安，忘战必危。”校场讲武已毕，可赴长平。","seed":11,"hour0":4,"hourLen":200,"face":{"1":0,"2":3.1416},"cam":[17,20],"weather":{"type":"sun","wind":0,"str":2},"draw":[{"op":"road","pts":[[0,19],[20,19],[40,18],[59,18]]},{"op":"hill","x":24,"y":9,"r":3.5},{"op":"forest","x":38,"y":28,"r":3.6},{"op":"forest","x":5,"y":31,"r":2.5},{"op":"marsh","x":30,"y":33,"r":2}],"camps":[{"x0":4,"y0":15,"x1":14,"y1":24,"side":1}],"points":[{"x":22,"y":19,"side":1,"name":"将台","time":8}],"labels":[{"t":"校场","x":6,"y":13.5,"s":30},{"t":"南林","x":37,"y":24.2,"s":26}],"units":[{"side":1,"type":"dun","n":3000,"x":10,"y":19,"name":"中军","general":true,"name_en":"Centre"},{"side":1,"type":"ji","n":3000,"x":13,"y":17,"name":"前军","name_en":"Vanguard"},{"side":1,"type":"ji","n":2400,"x":13,"y":21,"name":"左军","name_en":"Left Wing"},{"side":1,"type":"nu","n":2500,"x":8,"y":22,"name":"弩营","name_en":"Crossbow Camp"},{"side":1,"type":"qi","n":2000,"x":8,"y":16,"name":"骑营","name_en":"Horse Camp"},{"side":2,"type":"nu","n":1200,"x":38,"y":28,"name":"伏兵","tag":"伏","ambush":true,"ai":{"mode":"stay"},"name_en":"Ambushers"}],"events":[{"t":0.6,"do":"lesson","title":"第一课　行军","text":"此为讲武校场。先学行军。\n电脑：左键点选一阵，右键点地面，军阵即开往该处。\n手机：轻点军阵选中，再轻点地面。\n视野：方向键或 WASD 移动，滚轮缩放（手机单指拖动、双指缩放），点右下小地图可跳转。\n令“前军”（戟兵）开到东面“将台”旗下。","ok":"领命","title_en":"Lesson 1 · Marching","text_en":"This is the drill ground. First, learn to march.\nMouse: left-click a unit to select it, then right-click the ground and it marches there.\nTouch: tap a unit to select it, then tap the ground.\nView: arrow keys or WASD to pan, mouse wheel to zoom (on touch, drag with one finger and pinch). Click the minimap at bottom-right to jump.\nMarch the Vanguard (halberdiers) to the Command Platform flag (将台) to the east.","ok_en":"Understood"}],"triggers":[{"when":{"type":"near","x":22,"y":19,"r":2.2},"do":[{"do":"flag","name":"一"},{"do":"lesson","title":"第二课　统众","text":"善。一将不能独战，再学统领诸阵。\n按 Q（或下方“全选”）选中全军；也可按住左键拖框圈选多阵；按住 Shift 点选可增减；双击一阵，选中同种全部军阵。\n多阵同时右键一处，会排成方块齐进。\n令全军开到将台。","ok":"领命","title_en":"Lesson 2 · Commanding the Army","text_en":"Well done. One general cannot fight alone — now learn to lead many units.\nPress Q (or the All button) to select your whole army. You can also drag a box around several units, Shift-click to add or remove one, or double-click a unit to select every unit of that kind.\nRight-click one spot with several units selected and they march there in a block.\nBring the whole army to the Command Platform.","ok_en":"Understood"}]},{"when":{"type":"all","of":[{"type":"flag","name":"一"},{"type":"used","c":"multi"},{"type":"near","x":22,"y":19,"r":3.5,"n":4}]},"do":[{"do":"flag","name":"二"},{"do":"lesson","title":"第三课　四阵","text":"阵者，兵之形也。选中军阵，按数字键或下方按钮变阵：\n1 方阵：攻守平均，常备之阵，锋矢冲来也能稳住。\n2 锋矢阵：攻击加三成、行军更快，但防御减弱；冲阵破敌用之，最克雁行阵，撞上圆阵则钝。\n3 圆阵：防御加四成，不惧侧背夹击，但行动迟缓；被围或待援时用之。\n4 雁行阵：箭矢杀伤加三成、射程更远；弩手专用之阵。\n选中全军，四阵各变一次。","ok":"领命","title_en":"Lesson 3 · The Four Formations","text_en":"Formation is the shape of an army. Select units and press a number key or the buttons below:\n1 Square: balanced attack and defence; the standard formation, steady even against an Arrowhead charge.\n2 Arrowhead: +30% attack and faster marching, but weaker defence. Use it to smash enemy lines; it crushes the Wild Goose but blunts itself on a Circle.\n3 Circle: +40% defence and immune to flank and rear attacks, but slow. Use it when surrounded or waiting for help.\n4 Wild Goose: +30% missile damage and longer range — the crossbowmen's formation.\nSelect the whole army and try each of the four formations once.","ok_en":"Understood"}]},{"when":{"type":"all","of":[{"type":"flag","name":"二"},{"type":"used","c":["fang","feng","yuan","yan"]}]},"do":[{"do":"flag","name":"三"},{"do":"spawn","units":[{"side":2,"type":"ji","n":1500,"x":31,"y":19,"name":"靶阵","tag":"靶","ai":{"mode":"stay"},"name_en":"Target Company"}]},{"do":"lesson","title":"第四课　接战","text":"东面来了一阵敌军（“靶阵”）。\n选中我军，右键点敌阵即进攻（手机：轻点敌阵）。\n兵种相克：戟克骑，骑克弩，盾克戟与弩。靶阵是戟兵，以盾兵当之最好，切莫让骑兵去撞。\n侧背受击的敌阵伤亡、士气损失大增；士气崩溃则溃走。\n击破靶阵。","ok":"领命","title_en":"Lesson 4 · Engaging","text_en":"An enemy unit has appeared to the east: the Target Company (靶阵).\nSelect your troops and right-click the enemy to attack (touch: tap the enemy).\nCounters: halberdiers beat cavalry, cavalry beat crossbowmen, shieldmen beat halberdiers and crossbowmen. The target is halberdiers, so meet them with shieldmen — and keep your cavalry away.\nEnemies hit in the flank or rear take far heavier losses and morale damage; when morale breaks, they rout.\nDestroy the Target Company.","ok_en":"Understood"}]},{"when":{"type":"all","of":[{"type":"flag","name":"三"},{"type":"tagDead","tag": function computeGap(){const blk=(x,y)=>{if(x<0||y<0||x>=MW||y>=MH)return false;const t=G.map[y*MW+x];return t===WALL||t===RIVER||t===CLIFF;};
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=y*MW+x;G.gap[i]=0;if(blk(x,y))continue;let w=9;
  for(const[ax,ay]of[[1,0],[0,1]]){let n=1;for(let k=1;k<5&&!blk(x+ax*k,y+ay*k);k++)n++;for(let k=1;k<5&&!blk(x-ax*k,y-ay*k);k++)n++;if(n<w)w=n;}
  if(w<=2)G.gap[i]=w;}}

 for(let i=0;i<MW*MH;i++)e[i]=m[i]===HILL?1:m[i]===WALL?2:0;
 for(let lv=2;lv<=3;lv++){const up=[];for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const i=y*MW+x;if(e[i]!==lv-1)continue;let ok=true;
   for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(!hill(nx,ny)||(nx>=0&&ny>=0&&nx<MW&&ny<MH&&e[ny*MW+nx]<lv-1)){ok=false;break;}}if(ok)up.push(i);}
  for(const i of up)e[i]=lv;}
 for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){const i=y*MW+x;if(m[i]!==CAMP||!G.own[i])continue;for(let d=0;d<8;d++){const t=m[(y+DY[d])*MW+x+DX[d]];if(t===WALL||t===GATE){e[i]=2;G.ramp[i]=1;break;}}}}

/* ---------- 地图构筑 ---------- */
function build(g){
 const m=g.map,R=g.rnd;
 const set=(x,y,t)=>{m[y*MW+x]=t;};
 function poly(pts,rad,fn){for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])*3);
  for(let s=0;s<=n;s++){const px=a[0]+(b[0]-a[0])*s/n,py=a[1]+(b[1]-a[1])*s/n;
   for(let y=Math.floor(py-rad);y<=Math.ceil(py+rad);y++)for(let x=Math.floor(px-rad);x<=Math.ceil(px+rad);x++){
    if(x<0||y<0||x>=MW||y>=MH)continue;if(Math.hypot(x-px,y-py)<=rad)fn(x,y);}}}}
 return{
  river(p){g.riverLines.push(p);poly(p,1.15,(x,y)=>set(x,y,RIVER));},
  road(p){g.roadLines.push(p);poly(p,1.05,(x,y)=>{if(m[y*MW+x]===RIVER)set(x,y,FORD);});
   poly(p,.72,(x,y)=>{const t=m[y*MW+x];if(t!==FORD&&t!==RIVER)set(x,y,ROAD);});},
  blob(cx,cy,r,t){for(let y=Math.floor(cy-r-1);y<=cy+r+1;y++)for(let x=Math.floor(cx-r-1);x<=cx+r+1;x++){
   if(x<0||y<0||x>=MW||y>=MH)continue;if(Math.hypot(x-cx,y-cy)<r*(.72+.4*R())&&m[y*MW+x]===PLAIN)set(x,y,t);}},
  fort(x0,y0,x1,y1,side,gates){g.fortList.push({x0,y0,x1,y1,side,gates});for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const e=x===x0||x===x1||y===y0||y===y1;set(x,y,e?WALL:CAMP);g.own[y*MW+x]=side;}
   for(const[gx,gy,hp]of gates){const i=gy*MW+gx;set(gx,gy,GATE);const o={i,tx:gx,ty:gy,x:(gx+.5)*TS,y:(gy+.5)*TS,hp,max:hp,side};g.gates.push(o);g.gateIdx[i]=o;
    const ix=gx===x0?1:gx===x1?-1:0,iy=gy===y0?1:gy===y1?-1:0;for(const k of[-1,1]){const tx=gx+ix+(ix?0:k),ty=gy+iy+(iy?0:k);if(tx>x0&&tx<x1&&ty>y0&&ty<y1)g.tower[ty*MW+tx]=1;}}},
  cliff(p,rad){poly(p,rad||1,(x,y)=>{const t=m[y*MW+x];if(t===PLAIN||t===HILL||t===FOREST||t===MARSH)set(x,y,CLIFF);});},
  camp(x0,y0,x1,y1,side){g.campList.push({x0,y0,x1,y1,side});for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(m[y*MW+x]===PLAIN||m[y*MW+x]===ROAD){if(m[y*MW+x]===PLAIN)set(x,y,CAMP);g.own[y*MW+x]=side;}}}
 };
}

/* ---------- 寻路 ---------- */
const gS=new Float32Array(MW*MH),came=new Int32Array(MW*MH),closed=new Uint8Array(MW*MH);
const DX=[1,-1,0,0,1,1,-1,-1],DY=[0,0,1,-1,1,-1,1,-1];
const pass=(i,u)=>{const t=G.map[i];if(t===RIVER||t===CLIFF)return false;if(t===WALL)return !!(u&&u.gear==='ladder');return true;};
function spdF(t,type){const cs=RU.cavSpeed;let s=SPD[t];if(type==='qi'){if(t===HILL)s=cs.hill;else if(t===FOREST)s=cs.forest;else if(t===MARSH)s=cs.marsh;}
 if(G.weather==='rain'&&(t===PLAIN||t===BURNT))s*=type==='qi'?RU.weather.rainPlainCav:RU.weather.rainPlainInf;return s;}
function nearPass(tx,ty){for(let r=1;r<8;r++)for(let y=ty-r;y<=ty+r;y++)for(let x=tx-r;x<=tx+r;x++){if(x<0||y<0||x>=MW||y>=MH)continue;if(Math.max(Math.abs(x-tx),Math.abs(y-ty))!==r)continue;if(pass(y*MW+x))return y*MW+x;}return -1;}
function los(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/13);for(let s=0;s<=n;s++){const t=G.map[tileIdx(x0+(x1-x0)*s/n,y0+(y1-y0)*s/n)];if(!(t===PLAIN||t===ROAD||t===CAMP||t===BURNT))return false;}return true;}
function hpush(h,f,i){h.push([f,i]);let c=h.length-1;while(c>0){const p=(c-1)>>1;if(h[p][0]<=h[c][0])break;[h[p],h[c]]=[h[c],h[p]];c=p;}}
function hpop(h){const top=h[0],last=h.pop();if(h.length){h[0]=last;let c=0;for(;;){let l=c*2+1,r=l+1,s=c;if(l<h.length&&h[l][0]<h[s][0])s=l;if(r<h.length&&h[r][0]<h[s][0])s=r;if(s===c)break;[h[s],h[c]]=[h[c],h[s]];c=s;}}return top[1];}
function findPath(u,gx,gy){
 gx=cl(gx,4,WW-4);gy=cl(gy,4,WH-4);
 const tx=gx/TS|0,ty=gy/TS|0;let goal=ty*MW+tx,exact=true;
 if(!pass(goal,u)){goal=nearPass(tx,ty);exact=false;if(goal<0)return[];}
 const start=tileIdx(u.x,u.y);
 if(start===goal)return[exact?{x:gx,y:gy}:cen(goal)];
 const gxT=goal%MW,gyT=goal/MW|0;
 gS.fill(1e9);closed.fill(0);const heap=[];gS[start]=0;came[start]=-1;hpush(heap,0,start);let found=false;
 let bestI=start,bestH=1e9;
 while(heap.length){const cur=hpop(heap);if(closed[cur])continue;closed[cur]=1;if(cur===goal){found=true;break;}
  const cx=cur%MW,cy=cur/MW|0;{const hx=Math.abs(cx-gxT),hy=Math.abs(cy-gyT),hh=Math.max(hx,hy)+.414*Math.min(hx,hy);if(hh<bestH){bestH=hh;bestI=cur;}}
  for(let d=0;d<8;d++){const nx=cx+DX[d],ny=cy+DY[d];if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const ni=ny*MW+nx;
   if(closed[ni]||!pass(ni,u))continue;if(d>=4&&(!pass(cy*MW+nx,u)||!pass(ny*MW+cx,u)))continue;
   const t=G.map[ni];let c=(d>=4?1.414:1)/spdF(t,u.type);
   if(t===GATE){const g=G.gateIdx[ni];if(g&&g.hp>0&&g.side!==u.side)c+=14;}
   if(G.fires.has(ni))c+=8;
   const ng=gS[cur]+c;if(ng<gS[ni]){gS[ni]=ng;came[ni]=cur;const ax=Math.abs(nx-gxT),ay=Math.abs(ny-gyT);
    hpush(heap,ng+(Math.max(ax,ay)+.414*Math.min(ax,ay))*.77,ni);}}}
 if(!found){if(bestI===start)return[];goal=bestI;exact=false;}
 const pts=[];let c=goal;while(c!==start&&c>=0){pts.push(cen(c));c=came[c];}pts.reverse();
 if(exact)pts[pts.length-1]={x:gx,y:gy};
 const out=[];let ax=u.x,ay=u.y,i=0;
 while(i<pts.length){let j=Math.min(pts.length-1,i+14);while(j>i&&!los(ax,ay,pts[j].x,pts[j].y))j--;out.push(pts[j]);ax=pts[j].x;ay=pts[j].y;i=j+1;}
 return out;
}

 const k=side+kind;G.nameIdx[k]=G.nameIdx[k]||0;
 const u={id:G.uid++,side,type,kind,n,nMax:n,x:(tx+.5)*TS,y:(ty+.5)*TS,face:G.M.face[side],fm:'fang',morale:90,stam:100,path:[],target:null,ordered:false,
  hold:false,holdT:0,march:false,state:'idle',cd:Math.random()*2,fireCd:0,hidden:false,vis:side===1,visA:side===ME?1:0,ambushT:0,lastHit:-99,lastAtk:-99,
  chargeT:0,runT:0,death:false,alive:true,thinkT:Math.random()*.4,repT:0,general:false,auto:false,ai:null,siege:null,routT:0,r:20,hitT:0,contact:null,cd2:0,atkN:0,atkP:0,had:false,tag:''};

【条件】
{"type":"point","i":0,"side":1}        据点 i 归 side 所有
{"type":"dead","side":2}               该方主将已亡（或已降）
{"type":"tagDead","tag":"后队"}        带此标签的军阵已全灭
{"type":"wiped","side":2}              该方已无军阵

{"type":"near","x":30,"y":19,"r":2,"n":1}  我方（side 缺省为 1）至少 n 阵进到 (x,y) 周围 r 格内
{"type":"flag","name":"一"}            事件或触发器立过此标记
{"type":"used","c":"feng"}             玩家下过此令；c 可为数组，须全部下过。可用：select 点选 multi 多选 all 全选 move 行军 attack 进攻

{"type":"all","of":[…]}  {"type":"any","of":[…]}  {"type":"not","of":<条件>}

 pc.onconnectionstatechange=()=>{if(NET.tx!==tx)return;const st=pc.connectionState;if(st==='failed'){if(NET.started)netPeerLeft();else pvpStatus(rtcFail());}else if(st==='disconnected'&&!NET.started)pvpStatus(tr('连接中断，正在重试…','Connection dropped; retrying…'));};}
async function rtcHost(L){netClose();NET.role='host';NET.L=L;const pc=new RTCPeerConnection({iceServers:ICE_SERVERS});rtcWire(pc.createDataChannel('pvp',{ordered:true}),pc);
 await pc.setLocalDescription(await pc.createOffer());await iceDone(pc);return packSdp(pc.localDescription);}
async function rtcAccept(code){const d=await unpackSdp(code);if(d.type!=='answer')throw new Error('kind');if(!NET.pc||NET.role!=='host')throw new Error('state');await NET.pc.setRemoteDescription(d);}
async function rtcJoin(code){const d=await unpackSdp(code);if(d.type!=='offer')throw new Error('kind');netClose();NET.role='guest';const pc=new RTCPeerConnection({iceServers:ICE_SERVERS});NET.pc=pc;
 pc.ondatachannel=e=>rtcWire(e.channel,pc);await pc.setRemoteDescription(d);await pc.setLocalDescription(await pc.createAnswer());await iceDone(pc);return packSdp(pc.localDescription);}

function netInit(){
 try{$('bpvp').addEventListener('click',pvpLobby);}catch(e){}
 NET.roomState='none';
 try{if(window.claude&&window.claude.use){NET.roomState='pending';const settle=()=>{NET.roomState=NET.room?'ok':'none';try{if(NET.lobbyOpen&&!NET.role&&!$('modal').hidden)pvpLobby();}catch(e){}};
  window.claude.use('room').then(r=>{if(!r){settle();return;}NET.room=r;
   r.onPeers(ch=>{const seen={};NET.lobby=[];for(const p of ch.peers){const c=p&&p.presence&&p.presence.cp;if(!c||p.sameTab||typeof c.code!=='string'||!/^[a-z0-9]{4}$/.test(c.code)||seen[c.code])continue;seen[c.code]=1;NET.lobby.push({code:c.code,map:String(c.map||'').slice(0,16)});}pvpList();});settle();},settle);}}catch(e){NET.roomState='none';}
 try{setInterval(()=>{if(NET.role!=='host'||!NET.started||!G||G.over)return;const now=performance.now(),gap=now-NET.frameAt;if(gap<600)return;NET.frameAt=now;let n=Math.min(20,Math.round(gap/50));while(n-->0&&!G.over)update(.05);netHostTick(1);},500);}catch(e){}}
